# Build and test pg_lion against every supported PostgreSQL major.
#
#   pgdg    16, 17, 18 and 19 (beta) from apt.postgresql.org: the packaged
#           server and postgresql-server-dev-N headers a PGXN user builds
#           against.  Packaged servers have no injection_points module, so the
#           Makefile skips the specs that need it and says so.  18 runs on
#           arm64 as well, where the SIMD kernels' portable versions are the
#           ones the server picks rather than fallbacks.
#   source  REL_16_STABLE to REL_19_STABLE and master built from source with
#           --enable-cassert and, from 17, --enable-injection-points, the
#           injection_points module and the isolation tester installed, so
#           every isolation spec runs.  The build is cached per upstream
#           commit.  These are also the only jobs with an assert build, so the
#           debug_discard_caches run is here (on 16, 19 and master: the oldest
#           major's compatibility code and the two newest), and pg_lion is
#           built with UndefinedBehaviorSanitizer there, so the whole suite
#           runs under it and a report fails the step that met it.
#   dist    make dist, META.json validated against the PGXN Meta Spec, and the
#           archive built and tested on its own, outside the checkout.
#
# The injection-point specs - the race tests of the VACUUM/count/split
# interlocks - therefore run on every major from 17, from source.  16 has no
# injection points at all, and PGDG ships no injection_points module;
# docs/DEVELOPING.md says so.  The concurrent soak (test/soak) runs weekly,
# in soak.yml.
#
# The crash-recovery and hot-standby harness (test/recovery/run.sh) runs on
# every major, in both WAL modes and with wal_consistency_checking, so that
# every major replays lion's records: its phases 1, 1f, 2, 4 and 5 on the
# packages, and all of them, the injection-point phases included, on the
# source builds.
#
# lionvec's tests (the vector*.sql files, the lionvec_*.spec specs and the
# harness's phase 5) need pgvector: its package on the pgdg jobs, a build of
# its default branch on the source jobs, its 18 package on the dist job.
# Where it is expected - every job but a beta major's packages, which may not
# have one yet - a failed install or build fails the job, and PGVECTOR=1
# makes the Makefile and the harness fail instead of skipping those tests, as
# INJECTION_POINTS=1 does for the injection-point ones.
#
# The pgdg and source jobs run the unit tests twice: as built, and with
# AddressSanitizer and UndefinedBehaviorSanitizer (make unit SANITIZE=1),
# which is where the container and sparse code meets malformed input.
#
# Every server job runs the suite twice, as DESIGN.md section 25 requires:
# installcheck in generic-WAL mode and installcheck-rmgr with the custom
# resource manager preloaded - and then make hookcheck (DESIGN.md section
# 23).  All of them use ./dev.sh's private cluster, pointed at a socket
# directory and port of the job's own through LION_SOCK and LION_PORT, and
# .local/pg is a symlink to the installation under test.

name: CI

# Pull requests, and pushes to main, run automatically; any other branch runs
# only when started by hand (workflow_dispatch), so parallel branches don't
# queue the runners.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch supersedes a run still in
# progress, which is cancelled; every commit that reaches main runs in full.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  LION_SOCK: /tmp/lion-sock
  LION_PORT: "55432"

jobs:
  pgdg:
    name: PostgreSQL ${{ matrix.pg }} (PGDG packages${{ matrix.os == 'ubuntu-24.04-arm' && ', arm64' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17", "18", "19"]
        os: [ubuntu-24.04]
        include:
          - pg: "18"
            os: ubuntu-24.04-arm
    env:
      PG: ${{ matrix.pg }}
      PG_CONFIG: .local/pg/bin/pg_config
    steps:
      - uses: actions/checkout@v7

      - name: Install PostgreSQL ${{ matrix.pg }} from apt.postgresql.org
        run: |
          # No auto-created cluster: the tests run their own.
          sudo mkdir -p /etc/postgresql-common/createcluster.d
          echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.d/no-main.conf
          # Beta majors live in a component named after the version.
          if [ "$PG" -ge 19 ]; then
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y -c "$PG"
          else
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          fi
          sudo apt-get install -y --no-install-recommends "postgresql-$PG" "postgresql-server-dev-$PG"
          mkdir -p .local
          ln -sfn "/usr/lib/postgresql/$PG" .local/pg
          .local/pg/bin/pg_config --version

      # pg_lion_vector's tests need pgvector.  Every released major has a
      # package, and a missing one fails the job; once it is installed,
      # PGVECTOR=1 goes into the job's environment, under which the Makefile
      # will not leave lionvec's regression files and specs out, nor the
      # recovery harness its phase 5 - so an install that put nothing where
      # the server looks cannot pass green with no lionvec test run.  A beta
      # major apt.postgresql.org has no package for yet still tests
      # everything else, and says so.
      - name: Install pgvector
        run: |
          if sudo apt-get install -y --no-install-recommends "postgresql-$PG-pgvector"; then
            echo "PGVECTOR=1" >> "$GITHUB_ENV"
          elif [ "$PG" -ge 19 ]; then
            echo "::warning::no pgvector package for PostgreSQL $PG yet; the vector tests are skipped"
          else
            echo "::error::no pgvector package for PostgreSQL $PG"
            exit 1
          fi

      - name: Build
        run: make -j4 WERROR=1

      - name: Install
        run: sudo make install PG_CONFIG="$PWD/$PG_CONFIG"

      - name: Unit tests
        run: make unit

      - name: Unit tests with ASan and UBSan
        run: make unit SANITIZE=1 WERROR=1

      - name: Start a private cluster
        run: ./dev.sh reset

      - name: installcheck (generic WAL)
        run: |
          eval "$(./dev.sh env)"
          make installcheck

      - name: installcheck-rmgr (custom resource manager preloaded)
        run: |
          eval "$(./dev.sh env)"
          make installcheck-rmgr

      # pg_lion beside another extension on the same planner hook and with
      # its own resource manager, in both load orders, the non-heap table AM
      # refusals, counts on a sixteen-buffer pool, and - on 16, the only
      # major with the setting - the refusal to read a lion index under
      # old_snapshot_threshold (test/hook-check.sh).
      # The test module goes into the packaged installation with sudo, like
      # pg_lion itself.
      - name: hookcheck (hook coexistence, table AMs)
        run: |
          sudo make -C test/modules/lion_hooktest install PG_CONFIG="$PWD/$PG_CONFIG" WERROR=1
          eval "$(./dev.sh env)"
          make hookcheck HOOKCHECK_SKIP_INSTALL=1

      # WAL replay on the packaged majors too - without these steps nothing
      # on 16-18 ever replayed a lion record.  The recovery harness's phases
      # 1, 1f, 1h, 2 and 4 (crash recovery under load, a VACUUM on a server
      # without the resource manager, the free space map entries a crash
      # leaves on pages in use, a hot standby that replays everything the
      # primary writes, and its promotion, and lion_index_verify() on a
      # standby beside replay), and 5 (lionvec's TOAST locator, where
      # pgvector is installed), in both WAL modes, with
      # wal_consistency_checking, as the source jobs run them.  Phases 1b-1e,
      # 1g and 3 park a backend on an injection point, which the packaged
      # servers cannot.  The extension is already in the packaged prefix
      # (the Install step put it there with sudo), which this user cannot
      # write to, so the harness uses it instead of installing its own.
      - name: Crash recovery and standby replay (custom resource manager, consistency checked)
        run: |
          RECOVERY_SKIP_INSTALL=1 ./test/recovery/run.sh --prefix "/usr/lib/postgresql/$PG" \
            --phases "1 1f 1h 2 4 5" --mode rmgr --conf "wal_consistency_checking = 'pg_lion'"

      - name: Crash recovery and standby replay (generic WAL, consistency checked)
        run: |
          RECOVERY_SKIP_INSTALL=1 ./test/recovery/run.sh --prefix "/usr/lib/postgresql/$PG" \
            --phases "1 1f 1h 2 4 5" --conf "wal_consistency_checking = 'generic'"

      - name: Show regression diffs
        if: failure()
        run: |
          find test -name regression.diffs -exec cat {} + || true
          tail -n 100 .local/pg.log || true
          tail -n 200 test/recovery/log/*.log || true

  source:
    name: PostgreSQL ${{ matrix.branch }} (source, cassert${{ matrix.branch != 'REL_16_STABLE' && ', injection points' || '' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        branch: [REL_16_STABLE, REL_17_STABLE, REL_18_STABLE, REL_19_STABLE, master]
    env:
      PGPREFIX: /home/runner/pg-${{ matrix.branch }}
      PG_CONFIG: .local/pg/bin/pg_config
      # Fail rather than skip if the injection_points module is missing: the
      # Makefile then refuses to leave the injection-point specs out, and
      # test/recovery/run.sh fails instead of skipping its phases 1b-1e, 1g and 3.
      # 16 has no injection points, so there the specs and phases are left
      # out on purpose (0, not unset: nothing is guessed).
      INJECTION_POINTS: ${{ matrix.branch == 'REL_16_STABLE' && '0' || '1' }}
      # pg_lion itself, not the server, is built with UBSan for the tests:
      # a report aborts the backend (-fno-sanitize-recover), which fails the
      # test that met it, and the report is in the server log the failure
      # step prints.
      LION_UBSAN: -fsanitize=undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
      # The same for pgvector, which the job builds: lionvec's regression
      # files and specs, and the recovery harness's phase 5, fail rather
      # than skip without it.
      PGVECTOR: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the upstream commit
        id: upstream
        run: |
          sha=$(git ls-remote https://github.com/postgres/postgres.git "refs/heads/${{ matrix.branch }}" | cut -f1)
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache the PostgreSQL build
        id: cache
        uses: actions/cache@v6
        with:
          path: ${{ env.PGPREFIX }}
          key: pg-${{ runner.os }}-${{ matrix.branch }}-${{ steps.upstream.outputs.sha }}-cassert-inj-v1

      - name: Build PostgreSQL ${{ matrix.branch }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bison flex
          git clone -q --depth 1 --branch "${{ matrix.branch }}" \
            https://github.com/postgres/postgres.git "$RUNNER_TEMP/postgres"
          cd "$RUNNER_TEMP/postgres"
          inj=
          [ "$INJECTION_POINTS" = 1 ] && inj=--enable-injection-points
          ./configure -q --prefix="$PGPREFIX" --without-icu --without-zlib --without-readline \
            --enable-cassert --enable-debug $inj CFLAGS="-O1 -g"
          make -s -j4
          make -s install
          make -s -C src/test/isolation install
          if [ "$INJECTION_POINTS" = 1 ]; then
            make -s -C src/test/modules/injection_points install
          fi
          make -s -C contrib install

      - name: Link the installation
        run: |
          mkdir -p .local
          ln -sfn "$PGPREFIX" .local/pg
          .local/pg/bin/pg_config --version

      # pgvector's default branch, built against this one.  A build that
      # fails fails the job, here, rather than leaving the Makefile to find
      # no vector.control and skip every lionvec test with the job still
      # green, as continue-on-error did; a master pgvector does not build
      # against yet is a red job to look at, not a silent loss of coverage.
      - name: Build pgvector
        run: |
          git clone -q --depth 1 https://github.com/pgvector/pgvector.git "$RUNNER_TEMP/pgvector"
          make -s -C "$RUNNER_TEMP/pgvector" PG_CONFIG="$PWD/$PG_CONFIG"
          make -s -C "$RUNNER_TEMP/pgvector" install PG_CONFIG="$PWD/$PG_CONFIG"
          test -f "$("$PG_CONFIG" --sharedir)/extension/vector.control"

      - name: Build
        run: make -j4 WERROR=1

      # And again with UBSan, the build the tests below run: not with
      # WERROR, because GCC's -Warray-bounds reports false positives in code
      # the sanitizer has instrumented (the build above has every warning
      # an error).  The check is that the library really needs libubsan: a
      # module that only references its symbols would not load at all.
      - name: Build with UBSan
        run: |
          make clean
          make -j4 COPT="$LION_UBSAN"
          readelf -d pg_lion.so | grep -q 'libubsan'

      - name: Install
        run: make install

      - name: Unit tests
        run: make unit

      - name: Unit tests with ASan and UBSan
        run: make unit SANITIZE=1 WERROR=1

      - name: Start a private cluster
        run: ./dev.sh reset

      - name: installcheck (generic WAL, all isolation specs)
        run: |
          eval "$(./dev.sh env)"
          set -o pipefail
          make installcheck 2>&1 | tee installcheck.log
          if [ "$INJECTION_POINTS" = 1 ] && grep -q 'skipping isolation specs' installcheck.log; then
            echo "injection-point specs were skipped"; exit 1
          fi

      # debug_discard_caches = 1 flushes every cache entry at every catalog
      # read, which is how the relcache-flush bugs of DESIGN.md §21 ("A
      # relcache flush must not free the state") were found.  The setting
      # exists only in assert builds, so only these jobs can run it.  The
      # whole suite under it takes hours; test/sql/discard_caches.sql, which
      # the step above already ran with the setting switched on around its
      # own queries, is run again here with it on for EVERY statement - the
      # builds, inserts, VACUUMs and verify() between those queries too.
      # PGOPTIONS reaches every session pg_regress opens, which it extends
      # rather than replaces.  Measured on an assert 18.6 on a busy 4-CPU box:
      # 17 minutes, against about 3 for the same file in the step above; if
      # that is too much for two jobs, `if: matrix.branch == 'master'` halves
      # it.
      - name: discard_caches.sql with debug_discard_caches = 1 throughout
        if: matrix.branch == 'REL_16_STABLE' || matrix.branch == 'REL_19_STABLE' || matrix.branch == 'master'
        run: |
          eval "$(./dev.sh env)"
          PGOPTIONS="-c debug_discard_caches=1" make installcheck REGRESS=discard_caches ISOLATION=

      - name: installcheck-rmgr with wal_consistency_checking
        run: |
          eval "$(./dev.sh env)"
          make installcheck-rmgr WAL_CONSISTENCY=1

      - name: hookcheck (hook coexistence, table AMs)
        run: |
          eval "$(./dev.sh env)"
          make hookcheck WERROR=1

      # wal_consistency_checking compares pages only when a record is REPLAYED,
      # so the step above (a primary that never replays) proves little about
      # redo.  The recovery harness crashes the primary under load and builds
      # a hot standby from it, which replays every record both phases write,
      # and a mismatch is a FATAL in the startup process (test/recovery/README.md).
      # These are the steps that depend on the job's INJECTION_POINTS: set
      # to 1 (17 and later), run.sh fails rather than skip the injection-point
      # phases and still report ALL ... PASSED; set to 0 (16) it skips them.
      - name: Crash recovery and standby replay (custom resource manager, consistency checked)
        run: make recovery-check-rmgr RECOVERY_PREFIX="$PGPREFIX"

      - name: Crash recovery and standby replay (generic WAL, consistency checked)
        run: ./test/recovery/run.sh --prefix "$PGPREFIX" --conf "wal_consistency_checking = 'generic'"

      - name: Show regression diffs
        if: failure()
        run: |
          find test -name regression.diffs -exec cat {} + || true
          grep -h -A 30 'runtime error' .local/pg.log test/recovery/log/*.log || true
          tail -n 100 .local/pg.log || true
          tail -n 200 test/recovery/log/*.log || true

  dist:
    name: PGXN archive (build and test from the zip)
    runs-on: ubuntu-24.04
    env:
      PG: "18"
      # its pgvector package is installed below, and the archive's tests
      # must not skip lionvec's
      PGVECTOR: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Validate META.json
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpanminus
          cpanm -q -n -l "$RUNNER_TEMP/perl5" PGXN::Meta::Validator
          PERL5LIB="$RUNNER_TEMP/perl5/lib/perl5" perl "$RUNNER_TEMP/perl5/bin/validate_pgxn_meta" META.json

      - name: Check that the control files and META.json agree
        run: |
          # PGXN version X.Y.0 is extension version X.Y (DESIGN.md section 23).
          meta=$(sed -n 's/^   "version": "\(.*\)",$/\1/p' META.json)
          for c in pg_lion pg_lion_citext pg_lion_vector; do
            ctl=$(sed -n "s/^default_version = '\(.*\)'$/\1/p" $c.control)
            test "$ctl.0" = "$meta" || { echo "$c.control default_version $ctl vs META.json $meta"; exit 1; }
            test -f "$c--$ctl.sql"
          done

      - name: Install PostgreSQL ${{ env.PG }} from apt.postgresql.org
        run: |
          sudo mkdir -p /etc/postgresql-common/createcluster.d
          echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.d/no-main.conf
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends "postgresql-$PG" "postgresql-server-dev-$PG" \
            "postgresql-$PG-pgvector"

      - name: make dist
        run: |
          make dist PG_CONFIG="/usr/lib/postgresql/$PG/bin/pg_config"
          unzip -l pg_lion-*.zip
          # Nothing from the working tree or the benchmark harness.
          if unzip -Z1 pg_lion-*.zip | grep -E '(^|/)(\.local|bench|\.deps|\.github)/|\.(o|so|bc)$'; then
            echo "unexpected files in the archive"; exit 1
          fi

      - name: Build, install and test from the extracted archive
        run: |
          mkdir "$RUNNER_TEMP/dist"
          unzip -q pg_lion-*.zip -d "$RUNNER_TEMP/dist"
          cd "$RUNNER_TEMP"/dist/pg_lion-*/
          mkdir -p .local
          ln -sfn "/usr/lib/postgresql/$PG" .local/pg
          make -j4 WERROR=1
          sudo make install PG_CONFIG="$PWD/.local/pg/bin/pg_config"
          make unit
          ./dev.sh reset
          eval "$(./dev.sh env)"
          make installcheck || { find test -name regression.diffs -exec cat {} +; exit 1; }
