# Build and test pg_lion on every pull request:
#
#   pgdg    16, 17, 18 and 19 (beta) from apt.postgresql.org (pgdg.yml): the
#           packaged server and postgresql-server-dev-N headers a PGXN user
#           builds against.  Packaged servers have no injection_points
#           module, so the Makefile skips the specs that need it and says so.
#   source  REL_18_STABLE built from source with --enable-cassert and
#           --enable-injection-points, pg_lion built with UBSan
#           (source.yml).
#   dist    make dist, META.json validated against the PGXN Meta Spec, and the
#           archive built and tested on its own, outside the checkout.
#
# Started by hand, optional.yml builds REL_16_STABLE, REL_17_STABLE,
# REL_19_STABLE and master from source too, with the debug_discard_caches
# run, and runs 18's packages on arm64, which is not a first-class target.
#
# The injection-point specs - the race tests of the VACUUM/count/split
# interlocks - therefore run on 18 from source on every pull request, and on
# every major from 17 in a run of optional.yml.  16 has no
# injection points at all, and PGDG ships no injection_points module;
# docs/DEVELOPING.md says so.  The concurrent soak (test/soak) runs weekly,
# in soak.yml.
#
# The crash-recovery and hot-standby harness (test/recovery/run.sh) runs on
# every major, in both WAL modes and with wal_consistency_checking, so that
# every major replays lion's records: its phases 1, 1f, 2, 4 and 5 on the
# packages, and all of them, the injection-point phases included, on the
# source build.
#
# lionvec's tests (the vector*.sql files, the lionvec_*.spec specs and the
# harness's phase 5) need pgvector: its package on the pgdg jobs, a build of
# its default branch on the source builds, its 18 package on the dist job.
# Where it is expected - every job but a beta major's packages, which may not
# have one yet - a failed install or build fails the job, and PGVECTOR=1
# makes the Makefile and the harness fail instead of skipping those tests, as
# INJECTION_POINTS=1 does for the injection-point ones.
#
# The pgdg and source jobs run the unit tests twice: as built, and with
# AddressSanitizer and UndefinedBehaviorSanitizer (make unit SANITIZE=1),
# which is where the container and sparse code meets malformed input.
#
# Every server job runs the suite twice, as DESIGN.md section 25 requires:
# installcheck in generic-WAL mode and installcheck-rmgr with the custom
# resource manager preloaded - and then make hookcheck (DESIGN.md section
# 23).  All of them use ./dev.sh's private cluster, pointed at a socket
# directory and port of the job's own through LION_SOCK and LION_PORT, and
# .local/pg is a symlink to the installation under test.
#
# A pull request that changes only documentation skips all of the above
# (changes.yml says which files count); "CI result" still reports, and passes.

name: CI

# Pull requests, and pushes to main, run automatically; any other branch runs
# only when started by hand (workflow_dispatch), so parallel branches don't
# queue the runners.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch supersedes a run still in
# progress, which is cancelled; every commit that reaches main runs in full.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  LION_SOCK: /tmp/lion-sock
  LION_PORT: "55432"

jobs:
  # Whether this is a pull request that changes only documentation
  # (changes.yml), in which case the build and test jobs are skipped.
  changes:
    uses: ./.github/workflows/changes.yml

  # 16 to 19 from apt.postgresql.org (pgdg.yml); 18 on arm64 runs there
  # from optional.yml, by hand.
  pgdg:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/pgdg.yml
    with:
      versions: '["16", "17", "18", "19"]'

  # PostgreSQL 18 from source, with assertions and injection points
  # (source.yml); the other branches run there from optional.yml, by hand.
  source:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/source.yml
    with:
      branches: '["REL_18_STABLE"]'

  dist:
    name: PGXN archive (build and test from the zip)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      PG: "18"
      # its pgvector package is installed below, and the archive's tests
      # must not skip lionvec's
      PGVECTOR: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Validate META.json
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpanminus
          cpanm -q -n -l "$RUNNER_TEMP/perl5" PGXN::Meta::Validator
          PERL5LIB="$RUNNER_TEMP/perl5/lib/perl5" perl "$RUNNER_TEMP/perl5/bin/validate_pgxn_meta" META.json

      - name: Check that the control files and META.json agree
        run: |
          # PGXN version X.Y.0 is extension version X.Y (DESIGN.md section 23).
          meta=$(sed -n 's/^   "version": "\(.*\)",$/\1/p' META.json)
          for c in pg_lion pg_lion_citext pg_lion_vector; do
            ctl=$(sed -n "s/^default_version = '\(.*\)'$/\1/p" $c.control)
            test "$ctl.0" = "$meta" || { echo "$c.control default_version $ctl vs META.json $meta"; exit 1; }
            test -f "$c--$ctl.sql"
          done

      - name: Install PostgreSQL ${{ env.PG }} from apt.postgresql.org
        run: |
          sudo mkdir -p /etc/postgresql-common/createcluster.d
          echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.d/no-main.conf
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends "postgresql-$PG" "postgresql-server-dev-$PG" \
            "postgresql-$PG-pgvector"

      - name: make dist
        run: |
          make dist PG_CONFIG="/usr/lib/postgresql/$PG/bin/pg_config"
          unzip -l pg_lion-*.zip
          # Nothing from the working tree or the benchmark harness.
          if unzip -Z1 pg_lion-*.zip | grep -E '(^|/)(\.local|bench|\.deps|\.github)/|\.(o|so|bc)$'; then
            echo "unexpected files in the archive"; exit 1
          fi

      - name: Build, install and test from the extracted archive
        run: |
          mkdir "$RUNNER_TEMP/dist"
          unzip -q pg_lion-*.zip -d "$RUNNER_TEMP/dist"
          cd "$RUNNER_TEMP"/dist/pg_lion-*/
          mkdir -p .local
          ln -sfn "/usr/lib/postgresql/$PG" .local/pg
          make -j4 WERROR=1
          sudo make install PG_CONFIG="$PWD/.local/pg/bin/pg_config"
          make unit
          ./dev.sh reset
          eval "$(./dev.sh env)"
          make installcheck || { find test -name regression.diffs -exec cat {} +; exit 1; }

  # One check that sums up the rest: it fails if any job above failed or was
  # cancelled, and passes if they passed or were skipped as docs-only.  The
  # skipped jobs report under other names than a run's (a skipped call of
  # pgdg.yml is one "pgdg" check, not one per major), so this is the check
  # to require if branch protection ever requires one.
  result:
    name: CI result
    needs: [changes, pgdg, source, dist]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check the jobs' results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
