# The CI that does not run on every pull request, started by hand from the
# Actions tab (workflow_dispatch) on any branch:
#
#   source  PostgreSQL built from source with assertions and, from 17,
#           injection points (source.yml): by default every branch -
#           REL_16_STABLE to REL_19_STABLE and master - where pull requests
#           build REL_18_STABLE alone, and the debug_discard_caches run.
#   arm64   PostgreSQL 18's packages on an arm64 runner (pgdg.yml).  arm64
#           is not a first-class target.

name: Optional CI

on:
  workflow_dispatch:
    inputs:
      branches:
        description: JSON list of postgres.git branches to build from source ([] for none)
        type: string
        default: '["REL_16_STABLE", "REL_17_STABLE", "REL_18_STABLE", "REL_19_STABLE", "master"]'
      arm64:
        description: Run PostgreSQL 18's packages on arm64
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  source:
    if: inputs.branches != '[]'
    uses: ./.github/workflows/source.yml
    with:
      branches: ${{ inputs.branches }}

  arm64:
    if: inputs.arm64
    uses: ./.github/workflows/pgdg.yml
    with:
      versions: '["18"]'
      runner: ubuntu-24.04-arm
