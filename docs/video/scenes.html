<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pg_lion</title>
<!--
  Every frame of the video is this page at one instant: renderAt(t) poses the whole stage for time t
  (seconds), from the cue times in timeline.js, which build_audio.py writes from the narration.
  Nothing here animates by itself; render.py steps t and screenshots each frame.
  Open it in a browser with ?play to watch it in real time (without sound).
-->
<style>
@font-face { font-family: Inter; font-weight: 400; src: url(fonts/inter-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: Inter; font-weight: 500; src: url(fonts/inter-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: Inter; font-weight: 600; src: url(fonts/inter-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: Inter; font-weight: 700; src: url(fonts/inter-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: Inter; font-weight: 800; src: url(fonts/inter-latin-800-normal.woff2) format("woff2"); }
@font-face { font-family: JBM; font-weight: 400; src: url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: JBM; font-weight: 500; src: url(fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: JBM; font-weight: 700; src: url(fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2"); }

:root {
  --bg: #0b0e13; --bg2: #10151d; --panel: #151b25; --panel2: #1b2330; --line: #2a3446; --line2: #36425a;
  --text: #eef1f6; --muted: #929cae; --dim: #5d6779;
  --blue: #5b9cff; --blue-bg: #13233d; --green: #3ecf8e; --green-bg: #0f2c22;
  --amber: #f7b03c; --amber-bg: #33240c; --pink: #f0648c; --pink-bg: #36121f;
  --orange: #ff8a4c; --red: #ff6464; --gray: #8f99ab;
}
html, body { margin: 0; padding: 0; background: #000; }
body { font-family: Inter, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden;
  background: radial-gradient(1400px 900px at 50% 38%, #121824 0%, var(--bg) 70%); }
.a { position: absolute; }
.scene { position: absolute; inset: 0; display: none; }
.mono { font-family: JBM, monospace; }
svg.layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
canvas.layer { position: absolute; left: 0; top: 0; }

#brand { position: absolute; right: 90px; top: 50px; font-size: 30px; font-weight: 800; letter-spacing: -.01em; color: #7d889c; }
#brand b { color: var(--amber); font-weight: 800; }
#caption { position: absolute; left: 0; right: 0; bottom: 34px; display: flex; justify-content: center; }
#caption span { max-width: 1500px; font-size: 32px; line-height: 1.38; font-weight: 500; color: #f4f6fa;
  background: rgba(6, 8, 12, .78); padding: 9px 24px 11px; border-radius: 12px; text-align: center; }

.card { background: var(--panel); border: 1.5px solid var(--line); border-radius: 18px; }
.chip { border-radius: 12px; padding: 8px 26px; font-weight: 700; border: 2px solid; display: inline-block; }
.pill { border-radius: 999px; padding: 6px 18px; font-weight: 700; display: inline-block; }
.center { text-align: center; }
.code { font-family: JBM, monospace; white-space: pre; }
.kw { color: #c792ea; } .fn { color: #82aaff; } .str { color: #c3e88d; } .num { color: #f78c6c; } .cm { color: #5d6779; }
.big { font-weight: 800; letter-spacing: -.02em; }
</style>
</head>
<body>
<div id="stage">
  <div id="scenes"></div>
  <div id="brand">pg_<b>lion</b></div>
  <div id="caption"><span></span></div>
</div>
<script src="timeline.js"></script>
<script>
"use strict";
/* ------------------------------------------------------------------ helpers */
const TL = window.TIMELINE;
const CUE = {};
TL.scenes.forEach(s => s.cues.forEach(c => { CUE[c.id] = c; }));
const SC = {};
TL.scenes.forEach(s => { SC[s.id] = s; });
const A = (id, k = 0) => CUE[id].sentences[k].start;      // when sentence k of a cue starts
const Z = (id) => CUE[id].end;                               // when a cue's speech ends
// when a phrase of a cue's caption is spoken, by its share of the sentence's characters
function wt(id, phrase) {
  for (const s of CUE[id].sentences) {
    const i = s.cap.indexOf(phrase);
    if (i >= 0) return s.start + (s.end - s.start) * (i / s.cap.length);
  }
  throw new Error("no phrase '" + phrase + "' in cue " + id);
}
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, x) => a + (b - a) * x;
const P = (t, a, d) => clamp((t - a) / d);
const E = {
  out: x => 1 - Math.pow(1 - clamp(x), 3),
  io: x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; },
  back: x => { x = clamp(x); const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
const fmt = n => Math.round(n).toLocaleString("en-US");
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function mk(parent, cls, css, html) {
  const e = document.createElement("div");
  e.className = "a" + (cls ? " " + cls : "");
  if (css) Object.assign(e.style, css);
  if (html !== undefined) e.innerHTML = html;
  parent.appendChild(e);
  return e;
}
function box(x, y, w, h) { const s = { left: x + "px", top: y + "px" }; if (w != null) s.width = w + "px"; if (h != null) s.height = h + "px"; return s; }
// pose an element: opacity, offset, scale
function st(e, o = 1, x = 0, y = 0, s = 1) {
  e.style.opacity = o;
  e.style.visibility = o <= 0.001 ? "hidden" : "visible";
  e.style.transform = (e._base || "") + " translate(" + x + "px," + y + "px) scale(" + s + ")";
}
// fade and rise in at a, fade out at b (if given)
function show(e, t, a, b, dy = 22, d = 0.5) {
  const pin = E.out(P(t, a, d));
  const pout = b == null ? 0 : E.io(P(t, b, 0.4));
  st(e, pin * (1 - pout), 0, (1 - pin) * dy - pout * 10, 1);
  return pin * (1 - pout);
}
function pop(e, t, a, b, d = 0.45) {
  const pin = P(t, a, d), pout = b == null ? 0 : E.io(P(t, b, 0.35));
  st(e, clamp(pin * 2) * (1 - pout), 0, 0, lerp(0.6, 1, E.back(pin)) * (1 - pout * 0.1));
  return pin * (1 - pout);
}
const SVGNS = "http://www.w3.org/2000/svg";
function svgLayer(parent) { const s = document.createElementNS(SVGNS, "svg"); s.setAttribute("class", "layer"); s.setAttribute("viewBox", "0 0 1920 1080"); parent.appendChild(s); return s; }
function sv(parent, tag, attrs) { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
function canvasLayer(parent) {
  const c = document.createElement("canvas"); c.className = "layer"; c.width = 1920; c.height = 1080;
  c.style.width = "1920px"; c.style.height = "1080px"; parent.appendChild(c); return c.getContext("2d");
}
function rrect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
const COL = { blue: "#5b9cff", green: "#3ecf8e", amber: "#f7b03c", pink: "#f0648c", orange: "#ff8a4c",
  cell: "#1e2635", cellLine: "#2a3446", text: "#eef1f6", muted: "#929cae", dim: "#5d6779", white: "#ffffff" };

// slide in from the side, for the snappier cuts
function slide(e, t, a, b, dx = 60, d = 0.35) {
  const pin = E.out(P(t, a, d)), pout = b == null ? 0 : E.io(P(t, b, 0.25));
  st(e, pin * (1 - pout), (1 - pin) * dx, -pout * 16, 1);
  return pin * (1 - pout);
}
// a number that counts up from 0 to n between a and a + d
const tick = (t, a, d, n, pow = 1) => n * Math.pow(P(t, a, d), pow);
const chipHTML = (w, c, size = 30) => `<span class=chip style='color:var(--${c});border-color:var(--${c});font-size:${size}px;background:var(--${c}-bg)'>${w}</span>`;

/* ------------------------------------------------------------------ scenes */
const SCENES = [];
function scene(id, build, opts) { SCENES.push({ id, build, brand: !(opts && opts.nobrand) }); }

/* hook: every dashboard asks how many -------------------------------------- */
scene("hook", root => {
  const words = [["Every", "dashboard,"], ["every", "filter,"], ["every", "report"]];
  const lines = words.map(([a, b], i) => mk(root, "big", Object.assign(box(150, 250 + i * 128), { fontSize: "110px", lineHeight: "1" }),
    `<span style='color:#6f7a8e'>${a}</span> ${b}`));
  const pills = [["country = 'Japan'", "2,500,000"], ["type = 'purchase'", "312,408"], ["last 24 hours", "48,112"],
    ["status = 'error'", "1,284"], ["plan = 'pro'", "91,337"]].map(([k, v], i) => {
    const e = mk(root, "card", Object.assign(box(1150 + (i % 2) * 70, 200 + i * 118, 600, 92), { display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 30px", boxSizing: "border-box" }));
    e.innerHTML = `<span class=mono style='font-size:25px;color:var(--muted)'>${k}</span><span class='mono big' style='font-size:36px;color:var(--amber)'>${v}</span>`;
    return e;
  });
  const q = mk(root, "center big", Object.assign(box(0, 390, 1920), { fontSize: "150px", lineHeight: "1.05" }),
    "<span style='color:var(--amber)'>How many</span> rows match?");
  const at = [wt("h1", "dashboard") - 0.25, wt("h1", "every filter") - 0.1, wt("h1", "every report") - 0.1];
  const q0 = A("h2") - 0.2;
  return t => {
    lines.forEach((e, i) => slide(e, t, at[i], q0 - 0.2, -50));
    pills.forEach((e, i) => { const p = slide(e, t, A("h1") + 0.3 + i * 0.35, q0 - 0.2, 70); st(e, p, (1 - E.out(P(t, A("h1") + 0.3 + i * 0.35, 0.35))) * 70, Math.sin(t * 1.3 + i) * 5); });
    const p = P(t, q0, 0.45);
    st(q, clamp(p * 2.5), 0, 0, lerp(0.82, 1, E.back(p)));
  };
}, { nobrand: true });

/* pain: B-tree walks rows, GIN reads the table ----------------------------- */
scene("pain", root => {
  const sql = mk(root, "center code", Object.assign(box(0, 130, 1920), { fontSize: "36px" }),
    "<span class=kw>SELECT</span> <span class=fn>count</span>(*) <span class=kw>FROM</span> events <span class=kw>WHERE</span> country = <span class=str>'Japan'</span>;");
  const note = mk(root, "center", Object.assign(box(0, 190, 1920), { fontSize: "26px", color: "var(--muted)" }), "5,000,000 rows · 2,500,000 match");
  const panel = (x, name, color, sub) => {
    const e = mk(root, "card", box(x, 270, 800, 600));
    mk(e, "", Object.assign(box(44, 34), { fontSize: "58px", fontWeight: 800, color: `var(--${color})` }), name);
    mk(e, "", Object.assign(box(44, 110), { fontSize: "27px", color: "var(--muted)" }), sub);
    return e;
  };
  const L = panel(120, "B-tree", "blue", "counts one entry at a time");
  const R = panel(1000, "GIN", "green", "returns a bitmap, then reads the table");
  const cells = [];
  for (let j = 0; j < 8; j++) for (let i = 0; i < 24; i++) cells.push(mk(L, "", Object.assign(box(44 + i * 30, 180 + j * 30, 24, 24), { borderRadius: "5px", background: "#222b3a" })));
  const pages = [];
  for (let j = 0; j < 4; j++) for (let i = 0; i < 10; i++) pages.push(mk(R, "", Object.assign(box(44 + i * 72, 180 + j * 58, 62, 48), { borderRadius: "7px", background: "var(--panel2)", border: "1.5px solid var(--line2)" })));
  const lc = mk(L, "mono", Object.assign(box(44, 440), { fontSize: "30px", color: "var(--muted)" }), "");
  const rc = mk(R, "mono", Object.assign(box(44, 440), { fontSize: "30px", color: "var(--muted)" }), "");
  const lt = mk(L, "big", Object.assign(box(44, 488), { fontSize: "84px", color: "var(--blue)", lineHeight: "1" }), "157 ms");
  const rt = mk(R, "big", Object.assign(box(44, 488), { fontSize: "84px", color: "var(--green)", lineHeight: "1" }), "665 ms");
  const tl = A("p1"), tr = A("p2");
  return t => {
    show(sql, t, SC.pain.start + 0.05, null, 12, 0.3); show(note, t, SC.pain.start + 0.2, null, 8, 0.3);
    slide(L, t, SC.pain.start + 0.1, null, -60); slide(R, t, SC.pain.start + 0.2, null, 60);
    st(R, +R.style.opacity * lerp(0.35, 1, E.out(P(t, tr - 0.3, 0.3))));
    const pl = P(t, tl + 0.2, Z("p1") - tl - 0.2);
    const lit = Math.floor(pl * cells.length);
    cells.forEach((c, i) => { c.style.background = i < lit ? (i === lit - 1 ? "#ffffff" : "var(--blue)") : "#222b3a"; });
    lc.textContent = "count(*) = " + fmt(2500000 * Math.pow(pl, 2));
    pop(lt, t, Z("p1") - 0.2, null, 0.35);
    const pr = P(t, tr + 0.1, Z("p2") - tr - 0.1);
    const seen = Math.floor(pr * pages.length);
    pages.forEach((p, i) => { p.style.background = i < seen ? (i >= seen - 2 ? "var(--green)" : "#1d4a37") : "var(--panel2)"; p.style.borderColor = i < seen ? "var(--green)" : "var(--line2)"; });
    rc.textContent = "count(*) = " + fmt(2500000 * pr);
    pop(rt, t, Z("p2") - 0.1, null, 0.35);
  };
});

/* reveal: meet Lion ------------------------------------------------------- */
scene("reveal", root => {
  const r = rng(7), cols = 22, rows = 5, cs = 34, gap = 9;
  const gx = 960 - (cols * (cs + gap) - gap) / 2, gy = 210;
  const cells = [];
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const e = mk(root, "", Object.assign(box(gx + i * (cs + gap), gy + j * (cs + gap), cs, cs), { borderRadius: "7px", background: "#1a2130" }));
    cells.push({ e, on: r() < 0.46, d: Math.hypot(i - cols / 2, (j - rows / 2) * 2) });
  }
  const word = mk(root, "center big", Object.assign(box(0, 470, 1920), { fontSize: "200px", lineHeight: "1" }),
    '<span style="color:#7d889c">pg_</span><span style="color:var(--amber)">lion</span>');
  const tag = mk(root, "center", Object.assign(box(0, 720, 1920), { fontSize: "50px", fontWeight: 600 }),
    "a <span style='color:var(--amber)'>roaring-bitmap</span> index for Postgres");
  const t0 = A("r1");
  return t => {
    cells.forEach(c => {
      const p = E.out(P(t, t0 - 0.25 + c.d * 0.03, 0.3));
      c.e.style.background = c.on && p > 0 ? `rgba(247,176,60,${0.2 + 0.8 * p})` : "#1a2130";
      st(c.e, clamp(p * 1.5 + 0.2), 0, 0, lerp(0.5, 1, E.back(p)));
    });
    const p = P(t, t0 - 0.05, 0.5);
    st(word, clamp(p * 2), 0, 0, lerp(0.85, 1, E.back(p)));
    show(tag, t, A("r1", 1) - 0.1, null, 16, 0.4);
  };
}, { nobrand: true });

/* how: compressed bitmaps in chunks that know their counts ----------------- */
const CH = { n: 8, w: 196, g: 14, y: 200, cy: 470 };
CH.x0 = 960 - (CH.n * (CH.w + CH.g) - CH.g) / 2;
CH.x = i => CH.x0 + i * (CH.w + CH.g);
CH.types = ["bitmap", "list", "bitmap", "runs", "bitmap", "list", "bitmap", "runs"];
CH.counts = [4812, 38, 4211, 2400, 5020, 12, 3877, 1950];
CH.fill = (() => { const r = rng(9), dens = [0.7, 0.05, 0.6, 0.45, 0.8, 0.02, 0.6, 0.35];
  return dens.map(d => Array.from({ length: 64 }, () => r() < d)); })();
const ICON = { list: "[ 17, 402, … ]", bitmap: "▦ bitmap", runs: "▬▬ runs" };
scene("how", root => {
  const svg = svgLayer(root);
  const chunks = [], pages = [], cons = [], badges = [], lines = [];
  for (let c = 0; c < CH.n; c++) {
    const e = mk(root, "", Object.assign(box(CH.x(c), CH.y, CH.w, CH.w), { borderRadius: "14px", border: "2px solid var(--line2)", background: "var(--panel)" }));
    const ps = [];
    for (let k = 0; k < 64; k++) ps.push(mk(e, "", Object.assign(box(12 + (k % 8) * 21.5, 12 + ((k / 8) | 0) * 21.5, 17, 17), { borderRadius: "3px", background: CH.fill[c][k] ? "rgba(247,176,60,.7)" : "#263043" })));
    chunks.push(e); pages.push(ps);
    lines.push(sv(svg, "line", { x1: CH.x(c) + CH.w / 2, y1: CH.y + CH.w, x2: CH.x(c) + CH.w / 2, y2: CH.cy, stroke: "#f7b03c", "stroke-width": 2, "stroke-dasharray": "4 5" }));
    cons.push(mk(root, "center", Object.assign(box(CH.x(c), CH.cy, CH.w, 70), { borderRadius: "12px", border: "2px solid var(--amber)", background: "var(--amber-bg)", lineHeight: "66px", fontSize: "24px", fontWeight: 700, color: "var(--amber)" }), ICON[CH.types[c]]));
    badges.push(mk(root, "center mono", Object.assign(box(CH.x(c) + CH.w / 2 - 72, CH.cy + 84, 144, 46), { lineHeight: "46px", fontSize: "27px", fontWeight: 700, borderRadius: "999px", background: "var(--amber)", color: "#1a1204" }), fmt(CH.counts[c])));
  }
  const top = mk(root, "", Object.assign(box(CH.x0, 140, 1500), { fontSize: "28px", color: "var(--muted)", fontWeight: 600 }), "the table, in chunks of 64 pages");
  const key = mk(root, "mono", Object.assign(box(CH.x0 - 10, CH.cy - 52), { fontSize: "26px", color: "var(--amber)", background: "var(--bg)", padding: "4px 10px", borderRadius: "8px" }), "country = 'Japan'");
  const cur = mk(root, "", Object.assign(box(0, CH.cy - 10, CH.w + 20, 154), { borderRadius: "16px", border: "3px solid #fff", boxSizing: "border-box" }));
  const acc = mk(root, "card", box(260, 700, 760, 150));
  mk(acc, "mono", Object.assign(box(40, 22), { fontSize: "26px", color: "var(--muted)" }), "count(*) = sum of the chunk counts");
  const accN = mk(acc, "big mono", Object.assign(box(40, 62), { fontSize: "66px", color: "var(--amber)" }), "0");
  const vs = mk(root, "", Object.assign(box(1080, 712), { fontSize: "40px", lineHeight: "1.55", fontWeight: 700 }),
    "<span style='color:var(--amber)'>Lion:</span> 1 step per chunk<br><span style='color:var(--blue)'>B-tree:</span> 1 step per row");
  const t1 = A("w1"), tc = wt("w1", "compressed bitmaps"), tk = wt("w1", "in chunks"), tn = wt("w1", "know their own counts"), t2 = A("w2");
  const step = 0.24;
  return t => {
    show(top, t, t1 - 0.2, null, 10, 0.3);
    chunks.forEach((e, i) => pop(e, t, t1 - 0.15 + i * 0.05, null, 0.35));
    cons.forEach((e, i) => { pop(e, t, tc + i * 0.06, null, 0.35); lines[i].setAttribute("opacity", E.out(P(t, tc + i * 0.06, 0.3))); });
    show(key, t, tc, null, 8, 0.3);
    chunks.forEach((e, i) => { const hl = t > tk && t < tn + 0.3; e.style.borderColor = hl ? "var(--amber)" : "var(--line2)"; });
    badges.forEach((e, i) => pop(e, t, tn + 0.1 + i * 0.07, null, 0.35));
    show(acc, t, t2 - 0.2, null, 14, 0.3);
    let n = 0, idx = -1;
    for (let i = 0; i < CH.n; i++) if (t >= t2 + i * step + 0.12) n += CH.counts[i];
    if (t >= t2 && t < t2 + CH.n * step + 0.3) idx = Math.min(CH.n - 1, Math.floor((t - t2) / step));
    accN.textContent = fmt(n);
    st(cur, idx >= 0 ? 1 : 0, idx >= 0 ? CH.x(idx) - 10 : 0, 0);
    badges.forEach((b, i) => { b.style.background = idx >= i || (t > t2 + CH.n * step && t > t2) ? "#ffd27f" : "var(--amber)"; });
    show(vs, t, wt("w2", "instead of walking rows") - 0.1, null, 14, 0.35);
  };
});

/* numbers: 1.7 ms, 90x, and the other counts ------------------------------- */
scene("numbers", root => {
  const g1 = mk(root, "", box(0, 0, 1920, 1080));
  const lab = mk(g1, "", Object.assign(box(150, 160), { fontSize: "30px", color: "var(--muted)", fontWeight: 600 }), "<span class=mono>count(*)</span>, 2,500,000 of 5,000,000 rows");
  const big = mk(g1, "big", Object.assign(box(140, 210), { fontSize: "250px", lineHeight: "1", color: "var(--amber)" }), "1.7<span style='font-size:120px'> ms</span>");
  const x90 = mk(g1, "", box(1130, 230, 700));
  mk(x90, "big", { fontSize: "190px", lineHeight: "1", color: "var(--text)", position: "relative" }, "90×");
  mk(x90, "", { fontSize: "42px", fontWeight: 600, color: "var(--muted)", position: "relative", marginTop: "10px" }, "faster than a B-tree");
  const bars = [["B-tree", 157.0, "blue", "157 ms"], ["GIN", 665.0, "green", "665 ms"], ["Lion", 1.744, "amber", "1.7 ms"]].map(([n, v, c, s], i) => {
    const y = 560 + i * 92;
    mk(g1, "", Object.assign(box(150, y + 8, 160), { fontSize: "36px", fontWeight: 800, color: `var(--${c})` }), n);
    const b = mk(g1, "", Object.assign(box(330, y, 0, 62), { borderRadius: "8px", background: `var(--${c})` }));
    const l = mk(g1, "big", Object.assign(box(0, y + 8), { fontSize: "40px" }), s);
    return { b, l, w: Math.max(8, 1180 * v / 665) };
  });
  const tiles = [["9×", "two equality filters", "vs B-tree", "Two filters"], ["24×", "GROUP BY, 200 groups", "vs B-tree", "GROUP BY"], ["168×", "array tag count", "vs GIN", "Array tags"]].map(([n, what, vs, ph], i) => {
    const e = mk(root, "card", Object.assign(box(150 + i * 560, 250, 500, 440), { borderColor: "var(--amber)" }));
    mk(e, "big", Object.assign(box(44, 40), { fontSize: "170px", lineHeight: "1", color: "var(--amber)" }), n);
    mk(e, "", Object.assign(box(44, 250, 420), { fontSize: "36px", fontWeight: 700, lineHeight: "1.2" }), what);
    mk(e, "", Object.assign(box(44, 350), { fontSize: "30px", color: vs === "vs GIN" ? "var(--green)" : "var(--blue)", fontWeight: 700 }), vs);
    return { e, ph };
  });
  const foot = mk(root, "center", Object.assign(box(0, 760, 1920), { fontSize: "24px", color: "var(--dim)" }), "5M rows (200k documents for arrays) · vacuumed · PostgreSQL 18.6 · median of 3 runs");
  const t1 = A("n1"), t2 = A("n2");
  return t => {
    const out1 = t2 - 0.25;
    show(g1, t, SC.numbers.start, out1, 0, 0.2);
    show(lab, t, t1 - 0.1, null, 8, 0.3);
    const p = P(t, wt("n1", "1.7") - 0.1, 0.45);
    st(big, clamp(p * 2.5), 0, 0, lerp(0.8, 1, E.back(p)));
    bars.forEach((b, i) => {
      const q = E.out(P(t, t1 + 0.2 + i * 0.25, 0.6));
      b.b.style.width = (b.w * q) + "px"; b.l.style.left = (350 + b.w * q) + "px"; st(b.l, q);
    });
    const q = P(t, A("n1", 1) - 0.1, 0.45);
    st(x90, clamp(q * 2.5), 0, 0, lerp(0.7, 1, E.back(q)));
    tiles.forEach(o => { const r = P(t, wt("n2", o.ph) - 0.15, 0.4); st(o.e, clamp(r * 2.5), 0, (1 - E.out(r)) * 40, lerp(0.9, 1, E.back(r))); });
    show(foot, t, t2 + 0.3, null, 6, 0.4);
  };
});

/* drop-in: it's just an index ---------------------------------------------- */
scene("dropin", root => {
  const head = mk(root, "center big", Object.assign(box(0, 140, 1920), { fontSize: "88px" }), "It's just an <span style='color:var(--amber)'>index</span>.");
  const code = mk(root, "card", box(260, 300, 1400, 250));
  const lines = [
    "<span class=kw>CREATE EXTENSION</span> pg_lion;",
    "<span class=kw>CREATE INDEX ON</span> events <span class=kw>USING</span> lion (country);",
    "<span class=kw>VACUUM</span> (<span class=kw>ANALYZE</span>) events;"].map((l, i) => mk(code, "code", Object.assign(box(50, 40 + i * 60), { fontSize: "36px" }), l));
  const q = mk(root, "card", box(260, 580, 1400, 250));
  mk(q, "code", Object.assign(box(50, 40), { fontSize: "34px" }), "<span class=kw>SELECT</span> <span class=fn>count</span>(*) <span class=kw>FROM</span> events <span class=kw>WHERE</span> country = <span class=str>'Japan'</span>;");
  mk(q, "", Object.assign(box(50, 112), { fontSize: "28px", color: "var(--muted)" }), "the query you already have, now planned as");
  const plan = mk(q, "mono", Object.assign(box(50, 160), { fontSize: "34px", fontWeight: 700, color: "var(--amber)", border: "3px solid var(--amber)", borderRadius: "12px", padding: "6px 18px" }), "Custom Scan (LionCount)");
  const t1 = A("d1"), t2 = A("d1", 1);
  const at = [wt("d1", "Create it") - 0.1, wt("d1", "Create it") + 0.35, wt("d1", "VACUUM") - 0.1];
  return t => {
    const p = P(t, t1 - 0.1, 0.4);
    st(head, clamp(p * 2.5), 0, 0, lerp(0.85, 1, E.back(p)));
    show(code, t, t2 - 0.2, null, 20, 0.35);
    lines.forEach((l, i) => { const r = P(t, at[i], 0.45); l.style.clipPath = `inset(0 ${100 - r * 100}% 0 0)`; st(l, r > 0 ? 1 : 0); });
    show(q, t, wt("d1", "Postgres uses it") - 0.2, null, 20, 0.35);
    pop(plan, t, wt("d1", "count queries") - 0.1, null, 0.4);
  };
});

/* fit: keep B-tree and GIN, add Lion where you count ----------------------- */
scene("fit", root => {
  const cards = [["B-tree", "blue", ["lookups", "ORDER BY … LIMIT", "UNIQUE keys"], "B-trees"],
    ["GIN", "green", ["full-text search", "JSONB documents", "phrase and prefix"], "GIN for text"],
    ["Lion", "amber", ["count(*)", "filters combined", "GROUP BY"], "Add Lion"]].map(([n, c, items, ph], i) => {
    const e = mk(root, "card", Object.assign(box(150 + i * 560, 250, 500, 400), { borderColor: `var(--${c})`, borderWidth: "2px" }));
    mk(e, "", Object.assign(box(48, 40), { fontSize: "72px", fontWeight: 800, color: `var(--${c})` }), n);
    mk(e, "", Object.assign(box(48, 160, 420), { fontSize: "38px", lineHeight: "1.7", fontWeight: 600 }), items.map(x => `<span style='color:var(--${c})'>•</span> ${x}`).join("<br>"));
    return { e, ph, c };
  });
  const keep = mk(root, "center", Object.assign(box(0, 150, 1920), { fontSize: "40px", fontWeight: 700, color: "var(--muted)" }), "Keep the indexes you have. Add Lion where you count.");
  return t => {
    show(keep, t, SC.fit.start + 0.1, null, 10, 0.3);
    cards.forEach((o, i) => {
      const a = wt("f1", o.ph) - 0.15, r = P(t, a, 0.4);
      st(o.e, clamp(r * 2.5), 0, (1 - E.out(r)) * 40, lerp(0.92, 1, E.back(r)));
      if (i === 2) o.e.style.boxShadow = t > a + 0.3 ? "0 0 0 6px rgba(247,176,60,.18), 0 0 60px rgba(247,176,60,.25)" : "none";
    });
  };
});

/* end: try it -------------------------------------------------------------- */
scene("end", root => {
  const r = rng(7), cols = 16, rows = 3, cs = 30, gap = 8;
  const gx = 960 - (cols * (cs + gap) - gap) / 2;
  const cells = [];
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++)
    cells.push({ e: mk(root, "", Object.assign(box(gx + i * (cs + gap), 190 + j * (cs + gap), cs, cs), { borderRadius: "6px", background: r() < 0.46 ? "var(--amber)" : "#1a2130" })), i });
  const word = mk(root, "center big", Object.assign(box(0, 340, 1920), { fontSize: "190px", lineHeight: "1" }),
    '<span style="color:#7d889c">pg_</span><span style="color:var(--amber)">lion</span>');
  const tag = mk(root, "center", Object.assign(box(0, 570, 1920), { fontSize: "56px", fontWeight: 700 }), "Try it on your data.");
  const url = mk(root, "center mono", Object.assign(box(0, 668, 1920), { fontSize: "34px", color: "var(--muted)" }), "github.com/cgkanchi/pg_lion");
  const fine = mk(root, "center", Object.assign(box(360, 770, 1200), { fontSize: "21px", lineHeight: "1.5", color: "var(--dim)" }),
    "pg_lion is a prototype. Counts are fastest on regularly vacuumed tables; inserts cost about 1.25× a B-tree's time.<br>Benchmarks: PostgreSQL 18.6 release build, 5M rows, median of 3 timed runs. Details in the README.");
  const t0 = A("e1");
  return t => {
    cells.forEach(c => st(c.e, E.out(P(t, t0 - 0.3 + c.i * 0.02, 0.3))));
    const p = P(t, t0 - 0.1, 0.5);
    st(word, clamp(p * 2), 0, 0, lerp(0.85, 1, E.back(p)));
    show(tag, t, A("e1", 1) - 0.1, null, 14, 0.35);
    show(url, t, A("e1", 1) + 0.3, null, 10, 0.35);
    show(fine, t, Z("e1") + 0.4, null, 6, 0.5);
  };
}, { nobrand: true });

/* ------------------------------------------------------------------ stage */
const scenesEl = document.getElementById("scenes");
const DRAW = SCENES.map(s => {
  const root = document.createElement("div"); root.className = "scene"; scenesEl.appendChild(root);
  return { id: s.id, root, brand: s.brand, meta: SC[s.id], draw: s.build(root) };
});
const brand = document.getElementById("brand");
const cap = document.getElementById("caption"), capSpan = cap.querySelector("span");
const SENT = []; TL.scenes.forEach(s => s.cues.forEach(c => c.sentences.forEach(x => SENT.push(x))));

function renderAt(t) {
  let brandOn = 0;
  DRAW.forEach((d, k) => {
    const m = d.meta, first = k === 0, last = k === DRAW.length - 1;
    // quick cuts: a short fade on each side of every scene
    const fin = first ? E.out(P(t, 0, 0.4)) : E.io(P(t, m.start - 0.02, 0.22));
    const fout = last ? E.io(P(t, TL.total - 0.8, 0.8)) : E.io(P(t, m.end - 0.2, 0.2));
    const o = t < m.start - 0.02 || t > m.end ? 0 : fin * (1 - fout);
    if (o <= 0) { d.root.style.display = "none"; return; }
    d.root.style.display = "block"; d.root.style.opacity = o;
    if (d.brand) brandOn = Math.max(brandOn, o);
    d.draw(t);
  });
  brand.style.opacity = brandOn;
  const c = SENT.find(x => t >= x.start - 0.06 && t < x.end + 0.25);
  if (c) {
    if (capSpan.textContent !== c.cap) capSpan.textContent = c.cap;
    cap.style.opacity = E.out(P(t, c.start - 0.06, 0.1)) * (1 - E.io(P(t, c.end + 0.15, 0.1)));
  } else cap.style.opacity = 0;
}
window.renderAt = renderAt;
window.TOTAL = TL.total;
if (location.search.includes("play")) {
  const t0 = performance.now(), m = /t=([\d.]+)/.exec(location.search), off = m ? +m[1] : 0;
  const tick = () => { renderAt(off + (performance.now() - t0) / 1000); requestAnimationFrame(tick); };
  tick();
} else renderAt(+(/t=([\d.]+)/.exec(location.search) || [0, 0])[1]);
</script>
