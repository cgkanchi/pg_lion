<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pg_lion</title>
<!--
  Every frame of the video is this page at one instant: renderAt(t) poses the whole stage for time t
  (seconds), from the cue times in timeline.js, which build_audio.py writes from the narration.
  Nothing here animates by itself; render.py steps t and screenshots each frame.
  Open it in a browser with ?play to watch it in real time (without sound), or ?t=20 for one instant.

  One cast of objects carries the story: 800 dots are the table's rows (6,250 rows each); the
  matching ones are counted by a B-tree and by GIN, fly together into a pixel lion, and then pack
  into the chunk bitmaps that Lion adds up.  The canvas draws that cast; the DOM draws the words.
-->
<style>
@font-face { font-family: Brico; font-weight: 600; src: url(fonts/bricolage-grotesque-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: Brico; font-weight: 700; src: url(fonts/bricolage-grotesque-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: Brico; font-weight: 800; src: url(fonts/bricolage-grotesque-latin-800-normal.woff2) format("woff2"); }
@font-face { font-family: Inter; font-weight: 400; src: url(fonts/inter-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: Inter; font-weight: 500; src: url(fonts/inter-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: Inter; font-weight: 600; src: url(fonts/inter-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: Inter; font-weight: 700; src: url(fonts/inter-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: JBM; font-weight: 500; src: url(fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: JBM; font-weight: 700; src: url(fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2"); }

:root {
  --bg: #f2f4f9; --ink: #141a2a; --muted: #5d6880; --faint: #9aa4b8; --line: #dce2ec; --card: #ffffff;
  --lion: #f59e0b; --lion-deep: #e27812; --lion-pale: #fff1d6;
  --blue: #3867f4; --blue-pale: #e4ebff; --green: #12a06a; --green-pale: #dcf4e9;
  --pink: #ec4f86; --red: #ef5a38; --red-pale: #ffe5dd;
}
html, body { margin: 0; padding: 0; background: #000; }
body { font-family: Inter, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background-color: var(--bg); }
#dots { position: absolute; inset: -40px; background-image: radial-gradient(#d3d9e6 1.6px, transparent 1.8px); background-size: 36px 36px; }
#glow { position: absolute; inset: 0; background: radial-gradient(1100px 700px at 50% 45%, rgba(255,255,255,.75), rgba(255,255,255,0) 70%); }
.a { position: absolute; }
.beat { position: absolute; inset: 0; }
canvas.layer { position: absolute; left: 0; top: 0; }
.brico { font-family: Brico, Inter, sans-serif; letter-spacing: -.02em; }
.mono { font-family: JBM, monospace; }
.card { background: var(--card); border-radius: 22px; box-shadow: 0 1px 2px rgba(20,30,60,.06), 0 14px 36px rgba(20,30,60,.09); }
.pill { border-radius: 999px; padding: 6px 20px; font-weight: 700; display: inline-block; }
.center { text-align: center; }
.code { font-family: JBM, monospace; white-space: pre; }
.kw { color: #7c4dff; } .fn { color: var(--blue); } .str { color: #0f8a5f; }
#caption { position: absolute; left: 0; right: 0; bottom: 34px; display: flex; justify-content: center; }
#caption span { max-width: 1500px; font-size: 32px; line-height: 1.38; font-weight: 500; color: #fff;
  background: rgba(20, 26, 42, .88); padding: 9px 24px 11px; border-radius: 14px; text-align: center; }
</style>
</head>
<body>
<div id="stage">
  <div id="dots"></div>
  <div id="glow"></div>
  <canvas id="world" class="layer" width="1920" height="1080"></canvas>
  <div id="beats"></div>
  <div id="caption"><span></span></div>
</div>
<script src="timeline.js"></script>
<script>
"use strict";
/* ------------------------------------------------------------------ timing helpers */
const TL = window.TIMELINE;
const CUE = {}, SC = {};
TL.scenes.forEach(s => { SC[s.id] = s; s.cues.forEach(c => { CUE[c.id] = c; }); });
const A = (id, k = 0) => CUE[id].sentences[k].start;      // when sentence k of a cue starts
const Z = (id) => CUE[id].end;                               // when a cue's speech ends
// when a phrase of a cue's caption is spoken, by its share of the sentence's characters
function wt(id, phrase) {
  for (const s of CUE[id].sentences) {
    const i = s.cap.indexOf(phrase);
    if (i >= 0) return s.start + (s.end - s.start) * (i / s.cap.length);
  }
  throw new Error("no phrase '" + phrase + "' in cue " + id);
}
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, x) => a + (b - a) * x;
const P = (t, a, d) => clamp((t - a) / d);
const E = {
  out: x => 1 - Math.pow(1 - clamp(x), 3),
  io: x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; },
  back: x => { x = clamp(x); const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  in: x => Math.pow(clamp(x), 2.4),
};
const fmt = n => Math.round(n).toLocaleString("en-US");
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, x) => { x = clamp(x); return "rgb(" + a.map((v, i) => Math.round(v + (b[i] - v) * x)).join(",") + ")"; };
const C = { grey: hex("#c7cfdc"), lion: hex("#f59e0b"), blue: hex("#3867f4"), green: hex("#12a06a"), red: hex("#ef5a38"),
  white: hex("#ffffff"), ink: hex("#141a2a"), line: hex("#dce2ec"), pale: hex("#fff1d6") };

/* ------------------------------------------------------------------ DOM helpers */
function mk(parent, cls, css, html) {
  const e = document.createElement("div");
  e.className = "a" + (cls ? " " + cls : "");
  if (css) Object.assign(e.style, css);
  if (html !== undefined) e.innerHTML = html;
  parent.appendChild(e);
  return e;
}
function box(x, y, w, h) { const s = { left: x + "px", top: y + "px" }; if (w != null) s.width = w + "px"; if (h != null) s.height = h + "px"; return s; }
function st(e, o = 1, x = 0, y = 0, s = 1) {
  e.style.opacity = o;
  e.style.visibility = o <= 0.001 ? "hidden" : "visible";
  e.style.transform = "translate(" + x + "px," + y + "px) scale(" + s + ")";
}
// in at a with a rise, out at b
function show(e, t, a, b, dy = 24, d = 0.45) {
  const pin = E.out(P(t, a, d)), pout = b == null ? 0 : E.io(P(t, b, 0.3));
  st(e, pin * (1 - pout), 0, (1 - pin) * dy - pout * 14, 1);
  return pin * (1 - pout);
}
// in at a with a springy scale, out at b
function pop(e, t, a, b, d = 0.45, from = 0.6) {
  const pin = P(t, a, d), pout = b == null ? 0 : E.io(P(t, b, 0.3));
  st(e, clamp(pin * 2.2) * (1 - pout), 0, 0, lerp(from, 1, E.back(pin)) * (1 - pout * 0.08));
  return clamp(pin * 2.2) * (1 - pout);
}

/* ------------------------------------------------------------------ the cast */
// the table: 40 x 20 dots, 6,250 rows each; about half of them match
const G = { cols: 40, rows: 20, sp: 26, x0: 263, y0: 322, r: 8 };
const DOTS = (() => { const r = rng(42), out = [];
  for (let i = 0; i < G.cols * G.rows; i++) {
    const c = i % G.cols, w = (i / G.cols) | 0;
    out.push({ i, c, w, x: G.x0 + c * G.sp, y: G.y0 + w * G.sp, m: r() < 0.5, j: r() });
  }
  return out; })();
const MATCH = DOTS.filter(d => d.m);
MATCH.forEach((d, k) => { d.k = k; });

// the lion, 16 x 16: M mane, F face, W muzzle, E eyes, N nose
const LION_MAP = [
  ".....MMMMMM.....",
  "...MMMMMMMMMM...",
  "..MMMMMMMMMMMM..",
  ".MMMFFMMMMFFMMM.",
  ".MMFFFFFFFFFFMM.",
  "MMFFFFFFFFFFFFMM",
  "MMFFFEFFFFEFFFMM",
  "MMFFFEFFFFEFFFMM",
  "MMFFFFFFFFFFFFMM",
  "MMFFFFWNNWFFFFMM",
  "MMMFFWWWWWWFFMMM",
  ".MMFFFWWWWFFFMM.",
  ".MMMFFFFFFFFMMM.",
  "..MMMMFFFFMMMM..",
  "...MMMMMMMMMM...",
  ".....MMMMMM....."];
const LCOL = { F: hex("#f8b84a"), W: hex("#ffe3a3"), E: hex("#1b2233"), N: hex("#5a2d14") };
const LION = (() => { const px = [];
  const at = (x, y) => y >= 0 && y < 16 && x >= 0 && x < 16 && LION_MAP[y][x] !== ".";
  LION_MAP.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === ".") return;
    let col = LCOL[ch];
    if (ch === "M") col = (!at(x - 1, y) || !at(x + 1, y) || !at(x, y - 1) || !at(x, y + 1)) ? hex("#d9661a") : hex("#ee8a1e");
    px.push({ gx: x, gy: y, col });
  }));
  return px; })();
const LZ = { cx: 960, cy: 440, ps: 30 };          // the lion's place and pixel pitch in "Meet Lion"
LION.forEach(p => { p.x = LZ.cx + (p.gx - 7.5) * LZ.ps; p.y = LZ.cy + (p.gy - 7.5) * LZ.ps; });
// each lion pixel is one matching dot; the others fade on the way
(() => {
  const byX = MATCH.slice().sort((a, b) => a.x - b.x || a.y - b.y);
  const lx = LION.map((p, n) => n).sort((a, b) => LION[a].x - LION[b].x || LION[a].y - LION[b].y);
  lx.forEach((n, k) => { const d = byX[Math.floor(k * byX.length / lx.length)]; LION[n].dot = d; d.lion = LION[n]; });
})();

// the chunks: tiles of a 6 x 6 bitmap, 8 on screen and 16 more on the conveyor
const T = { w: 180, gap: 26, y: 478, slots: 6, sq: 18, sg: 4, n: 24 };
T.x0 = 960 - (8 * T.w + 7 * T.gap) / 2;
T.pitch = T.w + T.gap;
const TILES = (() => { const r = rng(5), out = [];
  const counts = [4812, 3907, 5020, 4211, 2400, 4655, 3877, 4950];
  for (let i = 0; i < T.n; i++) {
    const fill = Array.from({ length: 36 }, () => r() < 0.72);
    out.push({ i, fill, count: i < 8 ? counts[i] : 2300 + Math.floor(r() * 2900) });
  }
  return out; })();
// the lion's pixels fly into the first eight tiles, left pixels to left tiles
(() => {
  const order = LION.map((p, n) => n).sort((a, b) => LION[a].x - LION[b].x);
  const per = order.length / 8, r = rng(8);
  for (let k = 0; k < 8; k++) {
    const mine = order.slice(Math.round(k * per), Math.round((k + 1) * per));
    const slots = Array.from({ length: 36 }, (_, s) => s).sort(() => r() - 0.5).slice(0, mine.length).sort((a, b) => a - b);
    TILES[k].fill = Array(36).fill(false);
    mine.forEach((n, q) => { LION[n].tile = k; LION[n].slot = slots[q]; TILES[k].fill[slots[q]] = true; });
  }
})();

/* ------------------------------------------------------------------ canvas */
const cv = document.getElementById("world"), ctx = cv.getContext("2d");
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
// a dot, or a square with rounded corners: s is the half size, k how square it is (0 circle, 1 square)
function blob(x, y, s, k, fill) {
  ctx.fillStyle = fill;
  if (k <= 0.01) { ctx.beginPath(); ctx.arc(x, y, s, 0, 6.2832); ctx.fill(); return; }
  rr(x - s, y - s, 2 * s, 2 * s, lerp(s, s * 0.28, k)); ctx.fill();
}

/* ------------------------------------------------------------------ beats */
const BEATS = [];
function beat(id, build) { const root = document.createElement("div"); root.className = "beat"; document.getElementById("beats").appendChild(root); BEATS.push({ id, root, draw: build(root) }); }

// times the whole cast shares
const TM = {};
function times() {
  TM.gridIn = SC.problem.start - 0.35;               // the rows fall into place
  TM.match = TM.gridIn + 0.7;                        // half of them light up
  TM.b0 = A("p1") + 0.9; TM.b1 = Z("p1");            // the B-tree counts them
  TM.g0 = A("p2"); TM.gs0 = wt("p2", "still reads the table") - 0.2; TM.gs1 = Z("p2") - 0.1;
  TM.fly0 = A("r1") - 0.5;                           // the matches fly into a lion
  TM.roar = A("r1") + 0.95;
  TM.pack0 = wt("w1", "compressed bitmaps") - 0.7;   // the lion packs into chunks
  TM.band = TM.pack0 + 0.5;                         // the table's chunks, once the lion has begun to leave
  TM.chunk = wt("w1", "chunk by chunk") - 0.1;
  TM.knows = wt("w1", "already knows its count") - 0.1;
  TM.c0 = A("w2") + 0.15; TM.c1 = TM.c0 + 2.7;        // the conveyor adds them up
  TM.v0 = A("v1"); TM.check = wt("v1", "checked row by row") - 0.2; TM.exact = wt("v1", "always exact") - 0.1;
  TM.clear = SC.payoff.start - 0.35;
}
times();
const conv = t => 16 * T.pitch * E.io(P(t, TM.c0, TM.c1 - TM.c0));
const tileX = (i, t) => T.x0 + i * T.pitch - conv(t);
const slotXY = (i, s, t) => [tileX(i, t) + 26 + (s % 6) * (T.sq + T.sg) + T.sq / 2, T.y + 26 + ((s / 6) | 0) * (T.sq + T.sg) + T.sq / 2];
// the tile under the check in "Pages that changed": the one nearest the middle once the conveyor stops
const CHECK = (() => { let best = 0; for (let i = 0; i < T.n; i++) if (Math.abs(tileX(i, 1e9) + T.w / 2 - 960) < Math.abs(tileX(best, 1e9) + T.w / 2 - 960)) best = i; return best; })();

function drawWorld(t) {
  ctx.clearRect(0, 0, 1920, 1080);
  const gone = E.io(P(t, TM.clear, 0.45));
  if (t > SC.payoff.start + 0.3) return;

  // the rows, until they fly
  if (t < TM.fly0 + 1.6) {
    const kB = MATCH.length * E.in(P(t, TM.b0, TM.b1 - TM.b0));
    const sweepX = lerp(G.x0 - 60, G.x0 + G.cols * G.sp + 40, E.io(P(t, TM.gs0, TM.gs1 - TM.gs0)));
    for (const d of DOTS) {
      const fall = E.out(P(t, TM.gridIn + d.c * 0.012 + d.j * 0.25, 0.5));
      if (fall <= 0) continue;
      let x = d.x, y = d.y - (1 - fall) * 120, s = G.r, col, a = fall;
      if (!d.m) {
        col = mix(C.grey, C.grey, 0);
        const f = E.io(P(t, TM.fly0 - 0.2 + d.j * 0.2, 0.4)); s *= 1 - f; a *= 1 - f;
      } else {
        const lit = E.out(P(t, TM.match + d.c * 0.015 + d.j * 0.2, 0.3));
        col = mix(C.grey, C.lion, lit);
        // the B-tree's count, one by one, blue; then back to amber for GIN
        const blue = d.k < kB ? 1 - E.io(P(t, TM.g0 - 0.2, 0.35)) : 0;
        if (blue > 0) col = mix(C.lion, C.blue, blue);
        // GIN: the list of matches flashes, then the table is read page by page
        const flash = Math.max(0, 1 - Math.abs(t - (TM.g0 + 0.45)) / 0.35);
        if (flash > 0) s *= 1 + 0.25 * flash;
        const green = d.x < sweepX && t > TM.gs0 ? 1 - E.io(P(t, TM.fly0 - 0.6, 0.35)) : 0;
        if (green > 0) col = mix(C.lion, C.green, green);
        if (Math.abs(d.x - sweepX) < 26 && t > TM.gs0 && t < TM.gs1) s *= 1.25;
        if (d.lion) {
          // fly into the lion: a dot becomes a pixel
          const p = d.lion, f = E.io(P(t, TM.fly0 + (p.x - 720) / 480 * 0.35 + d.j * 0.1, 0.9));
          if (f > 0) {
            x = lerp(d.x, p.x, f); y = lerp(d.y, p.y, f) - Math.sin(f * Math.PI) * 60;
            s = lerp(G.r, LZ.ps / 2 - 2, f);
            col = mix(C.lion, p.col, f);
            if (f >= 1) continue;               // the lion takes it from here
            blob(x, y, s, f, col); continue;
          }
        } else {
          const f = E.io(P(t, TM.fly0 + d.j * 0.3, 0.7));
          if (f > 0) { x = lerp(d.x, LZ.cx, f); y = lerp(d.y, LZ.cy, f); s *= 1 - f; a *= 1 - f; }
        }
      }
      if (s <= 0.2 || a <= 0.01) continue;
      ctx.globalAlpha = a; blob(x, y, s, 0, col); ctx.globalAlpha = 1;
      // the B-tree's cursor
    }
    if (t > TM.b0 && t < TM.b1 + 0.3) {
      const k = Math.min(MATCH.length - 1, Math.floor(kB));
      const d = MATCH[k];
      ctx.strokeStyle = "#3867f4"; ctx.lineWidth = 4;
      ctx.globalAlpha = 1 - P(t, TM.b1, 0.3);
      ctx.beginPath(); ctx.arc(d.x, d.y, 15, 0, 6.2832); ctx.stroke(); ctx.globalAlpha = 1;
    }
    if (t > TM.gs0 && t < TM.gs1 + 0.2) {
      ctx.fillStyle = "rgba(18,160,106,.14)";
      ctx.globalAlpha = 1 - P(t, TM.gs1, 0.2);
      rr(sweepX - 26, G.y0 - 22, 52, (G.rows - 1) * G.sp + 44, 12); ctx.fill(); ctx.globalAlpha = 1;
    }
  }

  // the lion, then its pixels packing into chunks
  if (t >= TM.fly0 + 0.4) {
    const roar = Math.sin(clamp((t - TM.roar) / 0.5) * Math.PI) * 0.07;
    // rings
    for (let q = 0; q < 3; q++) {
      const rp = P(t, TM.roar + q * 0.13, 0.9);
      if (rp > 0 && rp < 1) {
        ctx.strokeStyle = "rgba(245,158,11," + (0.45 * (1 - rp)) + ")"; ctx.lineWidth = 6 * (1 - rp) + 1;
        ctx.beginPath(); ctx.arc(LZ.cx, LZ.cy, 250 + rp * 330, 0, 6.2832); ctx.stroke();
      }
    }
    // the chunk band and the tiles appear under the flying pixels
    drawChunks(t, gone);
    for (const p of LION) {
      const d = p.dot, arrive = TM.fly0 + (p.x - 720) / 480 * 0.35 + d.j * 0.1 + 0.9;
      if (t < arrive) continue;
      const k = p.tile, f = E.io(P(t, TM.pack0 + k * 0.09 + (p.gy / 16) * 0.25, 0.8));
      const sc = 1 + roar;
      let x = LZ.cx + (p.x - LZ.cx) * sc, y = LZ.cy + (p.y - LZ.cy) * sc, s = (LZ.ps / 2 - 2) * sc, col = mix(p.col, p.col, 0);
      if (f > 0) {
        const [tx, ty] = slotXY(k, p.slot, t);
        x = lerp(x, tx, f); y = lerp(y, ty, f) - Math.sin(f * Math.PI) * 80;
        s = lerp(s, T.sq / 2, f); col = mix(p.col, C.lion, f);
      }
      ctx.globalAlpha = 1 - gone;
      blob(x, y, s, 1, col);
      ctx.globalAlpha = 1;
    }
  }
}
function drawChunks(t, gone) {
  const tileIn = i => TM.pack0 - 0.1 + i * 0.06;
  const band = E.out(P(t, TM.band, 0.6));
  const vdim = E.io(P(t, TM.v0 - 0.2, 0.4));
  for (let i = 0; i < T.n; i++) {
    const x = tileX(i, t);
    if (x > 1920 || x + T.w < 0) continue;
    const onConveyor = i >= 8;
    const tin = onConveyor ? 1 : E.back(P(t, tileIn(i), 0.45));
    const a = (onConveyor ? (t > TM.c0 ? 1 : 0) : clamp(P(t, tileIn(i), 0.45) * 2.2)) * (1 - gone);
    if (a <= 0) continue;
    const dim = i === CHECK ? 1 : 1 - 0.55 * vdim;
    ctx.globalAlpha = a * dim;
    // the chunk of the table above the tile
    if (band > 0) {
      const bx = x, by = 300, bw = T.w * (onConveyor ? 1 : clamp(band * 1.6 - i * 0.08)), hl = t > TM.chunk + i * 0.12 && t < TM.knows + 0.4;
      if (bw > 4) {
        ctx.fillStyle = hl ? "#fff1d6" : "#ffffff"; rr(bx, by, bw, 76, 14); ctx.fill();
        ctx.strokeStyle = hl ? "#f59e0b" : "#dce2ec"; ctx.lineWidth = 2; rr(bx, by, bw, 76, 14); ctx.stroke();
        for (let q = 0; q < 8; q++) {
          const px = bx + 16 + q * 20; if (px + 12 > bx + bw) break;
          const changed = i === CHECK && q === 5 && t > TM.v0 + 0.2;
          ctx.fillStyle = changed ? "#ef5a38" : hl ? "#f5b54a" : "#d6dce8"; rr(px, by + 18, 12, 40, 4); ctx.fill();
        }
        // a dashed link down to the tile
        ctx.strokeStyle = hl ? "#f59e0b" : "#c7cfdc"; ctx.setLineDash([5, 6]); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(bx + T.w / 2, by + 76); ctx.lineTo(bx + T.w / 2, T.y); ctx.stroke(); ctx.setLineDash([]);
      }
    }
    // the tile: a white card holding a 6 x 6 bitmap
    const s = tin, cx = x + T.w / 2, cy = T.y + T.w / 2;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy);
    ctx.shadowColor = "rgba(20,30,60,.12)"; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
    ctx.fillStyle = "#ffffff"; rr(x, T.y, T.w, T.w, 20); ctx.fill();
    ctx.shadowColor = "transparent";
    if (i === CHECK && t > TM.v0 + 0.2) { ctx.strokeStyle = "#ef5a38"; ctx.lineWidth = 4; rr(x, T.y, T.w, T.w, 20); ctx.stroke(); }
    for (let q = 0; q < 36; q++) {
      const [sx, sy] = slotXY(i, q, t);
      // the first eight tiles' bits are the lion's pixels, drawn as they land
      if (TILES[i].fill[q] && onConveyor) blob(sx, sy, T.sq / 2, 1, "#f59e0b");

    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

  const c2 = cvs.getContext("2d");
  const r = rng(77), bits = LION.map(p => ({ p, sx: 960 + (r() - 0.5) * 1700, sy: 400 + (r() - 0.5) * 900, j: r() }));
  const word = mk(root, "center brico", Object.assign(box(0, 520, 1920), { fontSize: "124px", fontWeight: 800, lineHeight: "1" }),
    "<span style='color:#8a94a8'>pg_</span><span style='color:var(--lion)'>lion</span>");
  const tag = mk(root, "center brico", Object.assign(box(0, 668, 1920), { fontSize: "54px", fontWeight: 700 }), "Try it on your data.");
  const url = mk(root, "center mono", Object.assign(box(0, 752, 1920), { fontSize: "30px", color: "var(--muted)" }), "github.com/cgkanchi/pg_lion");
  const fine = mk(root, "center", Object.assign(box(360, 826, 1200), { fontSize: "20px", lineHeight: "1.5", color: "var(--faint)" }),
    "pg_lion is a prototype. Counts are fastest on regularly vacuumed tables; inserts cost about 1.25× a B-tree's time.<br>Benchmarks: PostgreSQL 18.6 release build, 5M rows, median of 3 timed runs. Details in the README.");
  const t0 = SC.end.start;
  return t => {
    c2.clearRect(0, 0, 1920, 1080);
    const ps = 22, cx = 960, cy = 285;
    for (const b of bits) {
      const f = E.io(P(t, t0 - 0.2 + b.j * 0.5, 0.8));
      if (f <= 0) continue;
      const x = lerp(b.sx, cx + (b.p.gx - 7.5) * ps, f), y = lerp(b.sy, cy + (b.p.gy - 7.5) * ps, f);
      c2.globalAlpha = clamp(f * 3);
      c2.fillStyle = mix(C.lion, b.p.col, f);
      c2.beginPath(); c2.roundRect(x - 10, y - 10, 20, 20, lerp(10, 4, f)); c2.fill();
    }
    c2.globalAlpha = 1;
    pop(word, t, t0 + 0.2, null, 0.5, 0.7);
    show(tag, t, A("e1", 1) - 0.1, null, 14);
    show(url, t, A("e1", 1) + 0.3, null, 10);
    show(fine, t, Z("e1") + 0.4, null, 6, 0.5);
  };
});

/* ------------------------------------------------------------------ stage */
const cap = document.getElementById("caption"), capSpan = cap.querySelector("span");
const SENT = []; TL.scenes.forEach(s => s.cues.forEach(c => c.sentences.forEach(x => SENT.push(x))));
const bgDots = document.getElementById("dots");
function renderAt(t) {
  bgDots.style.transform = `translate(${(t * 6) % 36}px, ${(t * 3) % 36}px)`;
  drawWorld(t);
  BEATS.forEach(b => {
    const s = SC[b.id];
    // a beat is drawn from a little before its scene to a little after it
    const on = t > s.start - 1.2 && t < s.end + 1.2;
    b.root.style.display = on ? "block" : "none";
    if (on) b.draw(t);
  });
  const c = SENT.find(x => t >= x.start - 0.06 && t < x.end + 0.25);
  if (c) {
    if (capSpan.textContent !== c.cap) capSpan.textContent = c.cap;
    cap.style.opacity = E.out(P(t, c.start - 0.06, 0.1)) * (1 - E.io(P(t, c.end + 0.15, 0.1)));
  } else cap.style.opacity = 0;
}
window.renderAt = renderAt;
window.TOTAL = TL.total;
if (location.search.includes("play")) {
  const t0 = performance.now(), m = /t=([\d.]+)/.exec(location.search), off = m ? +m[1] : 0;
  const tick = () => { renderAt(off + (performance.now() - t0) / 1000); requestAnimationFrame(tick); };
  tick();
} else renderAt(+(/t=([\d.]+)/.exec(location.search) || [0, 0])[1]);
</script>
</body>
</html>
